<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host: {{ live_session['title'] }} · Msanii Halisi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root{
    --ink:#17110B; --bone:#F2E9D8; --brass:#2F6B4F; --rust:#B23A22; --text-gray:#B3A186;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; color:var(--bone); background:var(--ink);}
  a{color:inherit; text-decoration:none;}
  h1{font-family:'Bodoni Moda', serif; font-weight:500; font-size:22px;}
  code{background:#24201A; padding:3px 8px; border-radius:3px; font-size:12px;}
  .container{max-width:1200px; margin:0 auto; padding:0 24px;}
  header{padding:20px 0; border-bottom:1px solid #362F24;}
  .back{color:#D8C9A3; font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700;}
  .back:hover{color:var(--brass);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:24px 0 8px; flex-wrap:wrap;}
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .status-badge{font-size:11px; font-weight:800; letter-spacing:1.5px; padding:6px 12px; text-transform:uppercase;}
  .status-badge.live{background:var(--rust); color:var(--bone);}
  .status-badge.scheduled{background:transparent; border:1px solid #4A4030; color:var(--text-gray);}
  .status-badge.ended{background:#4A4030; color:var(--text-gray);}
  .share-line{color:var(--text-gray); font-size:13px; margin-bottom:20px;}
  .btn{display:inline-block; background:var(--brass); color:var(--bone); padding:12px 20px; font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase; border:2px solid var(--brass); cursor:pointer; transition:0.2s;}
  .btn:hover{background:transparent; color:var(--brass);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-outline{background:transparent; border:2px solid #4A4030; color:var(--bone);}
  .btn-outline:hover{border-color:var(--brass); color:var(--brass);}
  .live-grid{display:grid; grid-template-columns:1.4fr 0.9fr; gap:28px; padding-bottom:48px;}
  @media (max-width:900px){ .live-grid{grid-template-columns:1fr;} }
  .stage{background:#000; border:1px solid #362F24; position:relative;}
  #compose-canvas{width:100%; aspect-ratio:16/9; display:block; background:#000;}
  #self-preview{display:none;}
  #camera-requests{margin-top:16px; display:flex; flex-direction:column; gap:10px;}
  .camera-request-row{background:#24201A; border:1px solid #362F24; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px;}
  .camera-request-row .actions{display:flex; gap:8px;}
  .btn-sm{padding:7px 12px; font-size:10px;}
  .chat-panel{background:#24201A; border:1px solid #362F24; display:flex; flex-direction:column; height:100%; min-height:420px;}
  .chat-head{padding:14px 18px; border-bottom:1px solid #362F24; font-weight:800; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--brass);}
  .chat-messages{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px; max-height:440px;}
  .chat-messages .msg{font-size:13px; line-height:1.5;}
  .chat-messages .msg strong{display:block; font-size:11px; color:var(--brass); text-transform:uppercase; letter-spacing:0.5px;}
  .chat-input-row{display:flex; gap:8px; padding:14px 18px; border-top:1px solid #362F24;}
  .chat-input-row input{flex:1; background:#1A1410; border:1px solid #4A4030; color:var(--bone); padding:10px 12px; font-size:13px; font-family:'Inter';}
  .chat-input-row input::placeholder{color:#8A7B63;}
</style>
</head>
<body>
  <header><div class="container"><a href="/" class="back">&larr; Msanii Halisi</a></div></header>

  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <span class="status-badge {{ live_session['status'] }}" id="status-badge">{{ live_session['status']|upper }}</span>
        <h1>{{ live_session['title'] }} <span style="color:var(--text-gray); font-weight:400; font-size:15px;">(host console)</span></h1>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="go-live-btn" class="btn">Go live</button>
        <button id="end-live-btn" class="btn btn-outline" disabled>End &amp; save</button>
      </div>
    </div>
    <p class="share-line">Share this with viewers: <code>{{ request.host_url }}live/{{ live_session['room_code'] }}</code></p>

    <div class="live-grid">
      <div>
        <div class="stage">
          <canvas id="compose-canvas" width="1280" height="720"></canvas>
          <video id="self-preview" autoplay playsinline muted></video>
        </div>
        <div id="camera-requests"></div>
      </div>

      <div class="chat-panel">
        <div class="chat-head">Live Chat</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Say something…" maxlength="300">
          <button id="chat-send" class="btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.LIVE_ROOM = {{ live_session['room_code']|tojson }};
    window.HOST_NAME = {{ (live_session['host_name'] or 'Msanii Halisi')|tojson }};
  </script>
  <script src="/js/live-host.js"></script>
</body>
</html>
