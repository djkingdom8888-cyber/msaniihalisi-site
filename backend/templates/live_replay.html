<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replay: {{ live_session['title'] }} · Msanii Halisi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root{ --ink:#17110B; --bone:#F2E9D8; --brass:#2F6B4F; --text-gray:#B3A186; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; color:var(--bone); background:var(--ink);}
  a{color:inherit; text-decoration:none;}
  h1{font-family:'Bodoni Moda', serif; font-weight:500; font-size:clamp(24px,3.4vw,34px); margin-top:14px;}
  .container{max-width:900px; margin:0 auto; padding:0 24px;}
  header{padding:20px 0; border-bottom:1px solid #362F24;}
  .back{color:#D8C9A3; font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700;}
  .back:hover{color:var(--brass);}
  .player-shell{margin:32px 0 24px; background:#000; border:1px solid #362F24;}
  .player-shell video{width:100%; display:block; aspect-ratio:16/9; background:#000;}
  .eyebrow{color:var(--brass); font-weight:700; font-size:12px; letter-spacing:2px; text-transform:uppercase;}
  .meta{margin-top:10px; color:var(--text-gray); font-size:13px; padding-bottom:48px;}
</style>
</head>
<body>
  <header><div class="container"><a href="/" class="back">&larr; Msanii Halisi</a></div></header>
  <div class="container">
    <div class="player-shell"><video src="/{{ live_session['recording_path'] }}" controls></video></div>
    <span class="eyebrow">Replay</span>
    <h1>{{ live_session['title'] }}</h1>
    <p class="meta">Hosted by {{ live_session['host_name'] or 'Msanii Halisi' }} · Originally aired {{ live_session['started_at'] or live_session['created_at'] }}</p>
  </div>
</body>
</html>
